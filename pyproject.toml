[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "las-tool"
version = "0.1.0"
description = "A lightweight desktop tool for batch downsampling, cropping, and splitting LAS point clouds."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "LasTool contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "laspy>=2.5,<3",
    "numpy>=1.24,<3",
    "tkinterdnd2>=0.4.2,<1",
]

[project.gui-scripts]
lastool = "las_tool:run_app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
